<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Покрытие Панацеи в Ереване</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Карта на всю ширину, слева рабочая панель с тремя вкладками */
:root{
 --bg:#f4f6f5;--panel:#ffffff;--fg:#17211d;--muted:#5f6e67;--line:#dfe5e2;
 --ours:#1d8a5a;--gap:#e0522c;--partner:#d1931a;--new:#56658a;--soft:#eef3f1;
 --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--panel:#171f1c;--fg:#e6ece9;--muted:#93a39b;--line:#28332f;--soft:#1e2824;--ours:#3fbf86;--gap:#ff7a52;--partner:#f0b23d;--new:#8fa0c8;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);display:grid;grid-template-columns:400px 1fr;height:100dvh;font-size:14px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
header{padding:16px 16px 0;display:grid;gap:12px}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:500 18px var(--mono)}
.kpi span{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tab{border:0;background:none;color:var(--muted);font:600 13px var(--sans);padding:10px 8px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--ours)}
.tab:focus-visible{outline:2px solid var(--ours)}
.pane{overflow:auto;flex:1;min-height:0;padding:12px 16px 20px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.drow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.drow .nm{font-weight:600}
.drow .num{font:500 12.5px var(--mono);color:var(--muted);text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.item:hover{background:var(--soft)}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.item b{font-weight:600;display:block}
.item small{color:var(--muted);font-size:12px;display:block;line-height:1.4}
.km{font:500 13px var(--mono);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-top:4px}
.pill.pc{background:color-mix(in srgb,var(--partner) 18%,transparent);color:var(--partner)}
.pill.nw{background:color-mix(in srgb,var(--new) 18%,transparent);color:var(--new)}
.pill.full{background:color-mix(in srgb,var(--ours) 16%,transparent);color:var(--ours)}
.pill.mid{background:color-mix(in srgb,var(--partner) 16%,transparent);color:var(--partner)}
.pill.low{background:color-mix(in srgb,var(--gap) 16%,transparent);color:var(--gap)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 10px;font:600 12px var(--sans);cursor:pointer}
.chip.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--ours)}
h3{font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#wrap{position:relative;min-height:0}
#map{height:100%}
.layers{position:absolute;top:12px;right:12px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.fld{display:grid!important;gap:4px;font-size:12px;color:var(--muted)}
.fld select{font:500 13px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:230px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font:600 12px var(--sans);padding:6px 4px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--panel)}
.mx{overflow-x:auto;margin:0 -4px}
.mx table{border-collapse:collapse;font-size:12px;min-width:100%}
.mx th{font-weight:600;color:var(--muted);padding:4px 3px;text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);padding-right:8px;white-space:nowrap}
.mx td{text-align:center;padding:5px 3px;font:500 12px var(--mono);border-top:1px solid var(--line)}
.mx td.z{background:color-mix(in srgb,var(--gap) 30%,transparent);color:var(--gap)}
.mx td.o{background:color-mix(in srgb,var(--partner) 22%,transparent)}
.mx tr{cursor:pointer}.mx tr.sel td{outline:1px solid var(--ours)}
.mx tr:hover td:first-child{color:var(--ours)}
.pp-h{font-size:12px;margin-top:6px}.pp-h i{font-style:normal;color:#c2462a}
.layers summary{font-weight:600;cursor:pointer}
.layers label{display:flex;align-items:center;gap:8px;cursor:pointer}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.sw.sq{border-radius:2px;opacity:.7}
.leaflet-popup-content{font-family:var(--sans);font-size:13px;line-height:1.45;margin:12px 14px}
.leaflet-popup-content b{font-size:14px}
.pp-note{margin-top:6px;padding:6px 8px;background:#f1f4f2;border-radius:6px;font-size:12px;color:#33413b}
@media (max-width:820px){
 body{grid-template-columns:1fr;grid-template-rows:52dvh 1fr}
 #wrap{order:-1}
 aside{border-right:0;border-top:1px solid var(--line)}
 .layers{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;font-size:12px}
}
</style></head><body>
<aside>
 <header>
  <div>
   <h1>Покрытие Панацеи в Ереване</h1>
   <div class="sub">104 точки в Ереване из вашей таблицы против супермаркетов города. Выберите продукт и радиус: красным закрашено всё, что дальше радиуса от ближайшей полки с этим продуктом.</div>
  </div>
  <div class="kpis">
   <div class="kpi"><b id="k1">39</b><span>точек в Кентроне</span></div>
   <div class="kpi"><b id="k2">8×</b><span>разрыв центр / окраины на 100 тыс. жителей</span></div>
   <div class="kpi"><b id="k3">36</b><span>точек с узкой полкой</span></div>
  </div>
  <nav class="tabs" role="tablist">
   <button class="tab on" data-t="prod" role="tab">Продукты</button>
   <button class="tab" data-t="dist" role="tab">Районы</button>
   <button class="tab" data-t="go" role="tab">Куда идти</button>
   <button class="tab" data-t="pts" role="tab">Наши точки</button>
  </nav>
 </header>
 <section class="pane" id="p-prod"></section>
 <section class="pane" id="p-dist" hidden></section>
 <section class="pane" id="p-go" hidden></section>
 <section class="pane" id="p-pts" hidden></section>
</aside>
<div id="wrap">
 <div id="map"></div>
 <details class="layers" id="lay" open><summary>Слои карты</summary>
  <label class="fld">Продукт<select id="prodSel"></select></label>
  <div class="seg" id="radSeg"><button data-r="200" class="on">200 м</button><button data-r="500">500 м</button><button data-r="1000">1 км</button></div>
  <label><input type="checkbox" id="L-ours" checked><span class="sw" style="background:var(--ours)"></span>Точки Панацеи</label>
  <label><input type="checkbox" id="L-rad" checked><span class="sw" style="background:transparent;border:2px solid var(--ours)"></span><span id="radLbl">Радиус 200 м</span></label>
  <label><input type="checkbox" id="L-gap" checked><span class="sw sq" style="background:var(--gap)"></span><span id="gapLbl">Белые зоны (дальше 200 м)</span></label>
  <label><input type="checkbox" id="L-pc" checked><span class="sw" style="background:var(--partner)"></span>Сеть-партнёр, нет Панацеи</label>
  <label><input type="checkbox" id="L-nw" checked><span class="sw" style="background:var(--new)"></span>Новая сеть</label>
 </details>
</div>

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={ours:css('--ours'),gap:css('--gap'),pc:css('--partner'),nw:css('--new'),panel:css('--panel')};
const map=L.map('map',{preferCanvas:true}).setView([40.183,44.515],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const depthCls={'Полная линейка':'full','Почти полная':'mid','Узкая полка':'low'};
let PROD='',R=200;
const has=p=>!PROD||p.h.includes(PROD);
const G={ours:L.layerGroup(),rad:L.layerGroup(),pc:L.layerGroup(),nw:L.layerGroup()};

/* Белые зоны: красная маска по застроенной части города, из которой вырезаны круги радиуса R вокруг точек с выбранным продуктом */
const [ml,mg]=D.mstep;
const Gap=L.Layer.extend({
 onAdd(m){this.c=L.DomUtil.create('canvas','leaflet-zoom-hide');this.c.style.opacity=.42;this.c.style.pointerEvents='none';m.getPanes().overlayPane.appendChild(this.c);m.on('moveend zoomend resize',this.draw,this);this.draw()},
 onRemove(m){this.c.remove();m.off('moveend zoomend resize',this.draw,this)},
 draw(){
  const m=this._map,s=m.getSize(),c=this.c;c.width=s.x;c.height=s.y;
  L.DomUtil.setPosition(c,m.containerPointToLayerPoint([0,0]));
  const x=c.getContext('2d');x.fillStyle=C.gap;
  D.mask.forEach(([a,b])=>{const p1=m.latLngToContainerPoint([a+ml/2,b-mg/2]),p2=m.latLngToContainerPoint([a-ml/2,b+mg/2]);x.fillRect(p1.x,p1.y,p2.x-p1.x+1,p2.y-p1.y+1)});
  x.globalCompositeOperation='destination-out';
  const mpp=40075016.686*Math.cos(40.18*Math.PI/180)/Math.pow(2,m.getZoom()+8);
  const r=R/mpp;
  D.ours.filter(has).forEach(p=>{const q=m.latLngToContainerPoint([p.lat,p.lng]);x.beginPath();x.arc(q.x,q.y,r,0,7);x.fill()});
  x.globalCompositeOperation='source-over';
 }
});
const gap=new Gap();

function popup(p){
 const no=D.P.filter(z=>!p.h.includes(z));
 return `<b>${esc(p.c)}</b><br>${esc(p.a)}<br><span style="color:#5f6e67">${esc(p.d)}</span><br><span class="pill ${depthCls[p.dp]}">${p.dp}</span>`+
 `<div class="pp-h">${no.length?`Нет на полке: <i>${no.join(', ')}</i>`:'Берёт всю линейку'}</div>`+
 (p.p?`<div class="pp-note">${esc(p.p)}</div>`:'')+(p.ap?'<div style="font-size:11px;color:#8a958f;margin-top:4px">Место на карте примерное, в пределах района</div>':'');
}
D.ours.forEach(p=>{p.m=L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:C.ours,fillOpacity:1}).bindPopup(()=>popup(p)).addTo(G.ours)});
D.tg.forEach(t=>{
 const col=t.pc?C.pc:C.nw;
 t.m=L.circleMarker([t.lat,t.lng],{radius:6,color:'#fff',weight:1.5,fillColor:col,fillOpacity:.95})
  .bindPopup(`<b>${esc(t.n)}</b><br>${esc(t.a)}<br><span class="pill ${t.pc?'pc':'nw'}">${t.pc?'Сеть уже работает с вами':'Новая сеть'}</span><br>До ближайшей Панацеи: <b>${t.km} км</b>`).addTo(t.pc?G.pc:G.nw);
});
function refresh(){
 G.rad.clearLayers();
 D.ours.forEach(p=>{
  const ok=has(p);
  p.m.setStyle(ok?{radius:7,color:'#fff',weight:2,fillColor:C.ours,fillOpacity:1}:{radius:5,color:C.gap,weight:2,fillColor:C.panel,fillOpacity:1});
  if(ok)L.circle([p.lat,p.lng],{radius:R,color:C.ours,weight:1,opacity:.6,fillOpacity:.06,interactive:false}).addTo(G.rad);
  if(ok)p.m.bringToFront();
 });
 const lab=R>=1000?'1 км':R+' м';
 document.getElementById('radLbl').textContent='Радиус '+lab;
 document.getElementById('gapLbl').textContent=`Белые зоны (дальше ${lab}${PROD?' от «'+PROD+'»':''})`;
 if(map.hasLayer(gap))gap.draw();
 renderDist();renderProd();
}
const sel=document.getElementById('prodSel');
sel.innerHTML='<option value="">Любой продукт</option>'+D.P.map(z=>`<option>${z}</option>`).join('');
sel.onchange=()=>{PROD=sel.value;refresh()};
document.querySelectorAll('#radSeg button').forEach(b=>b.onclick=()=>{R=+b.dataset.r;document.querySelectorAll('#radSeg button').forEach(x=>x.classList.toggle('on',x===b));refresh()});
G.ours.addTo(map);G.rad.addTo(map);G.pc.addTo(map);G.nw.addTo(map);gap.addTo(map);
[['L-ours',G.ours],['L-rad',G.rad],['L-gap',gap],['L-pc',G.pc],['L-nw',G.nw]].forEach(([id,l])=>{
 document.getElementById(id).onchange=e=>e.target.checked?l.addTo(map):l.remove();
});
if(innerWidth<820)document.getElementById('lay').open=false;
map.fitBounds(D.ours.map(p=>[p.lat,p.lng]),{padding:[30,30]});
function setProd(z){PROD=z;sel.value=z;refresh()}

/* --- Продукты --- */
const SH={'Кентрон':'Кен','Арабкир':'Араб','Малатия-Себастия':'Мал','Нор Норк / Норк-Мараш':'Норк','Канакер-Зейтун':'Кан','Аван':'Аван','Шенгавит':'Шен','Аджапняк':'Адж','Эребуни':'Эреб','Давташен':'Давт','Нубарашен':'Нуб'};
const DORD=['Кентрон','Арабкир','Канакер-Зейтун','Аван','Нор Норк / Норк-Мараш','Давташен','Аджапняк','Малатия-Себастия','Шенгавит','Эребуни'];
const pr=document.getElementById('p-prod');
function renderProd(){
 const rows=D.P.map(z=>{
  const cnt=DORD.map(d=>D.ours.filter(p=>p.d===d&&p.h.includes(z)).length);
  const tot=D.ours.filter(p=>p.h.includes(z)).length;
  return {z,cnt,tot,miss:DORD.filter((d,i)=>cnt[i]===0)};
 });
 pr.innerHTML=`<p class="note">Сколько точек в каждом районе держат продукт. Красное — продукта в районе нет, жёлтое — одна точка. Нажмите на строку, чтобы увидеть продукт на карте.</p>
 <div class="mx"><table><thead><tr><th>Продукт</th>${DORD.map(d=>`<th title="${d}">${SH[d]}</th>`).join('')}<th>Всего</th></tr></thead><tbody>`+
 rows.map(r=>`<tr data-z="${r.z}" class="${PROD===r.z?'sel':''}"><td>${r.z}</td>${r.cnt.map(n=>`<td class="${n===0?'z':n===1?'o':''}">${n}</td>`).join('')}<td>${r.tot}</td></tr>`).join('')+
 `</tbody></table></div><h3>Где каких продуктов нет</h3>`+
 rows.filter(r=>r.miss.length).sort((a,b)=>b.miss.length-a.miss.length).map(r=>`<div class="drow" style="cursor:pointer" data-z="${r.z}"><span class="nm">${r.z}</span><span class="num">${r.tot} точ.</span><small style="grid-column:1/-1;color:var(--muted);font-size:12px">Нет: ${r.miss.join(', ')}</small></div>`).join('')+
 `<p class="note" style="margin-top:12px">Нубарашен не в таблице: там нет ни одной точки. Состав полки взят из колонки «Ապրանքատեսականի»; пустая ячейка считается полной линейкой.</p>`;
 pr.querySelectorAll('[data-z]').forEach(el=>el.onclick=()=>setProd(PROD===el.dataset.z?'':el.dataset.z));
}

/* --- Районы --- */
const pd=document.getElementById('p-dist');
function renderDist(){
 const rows=D.dist.map(r=>{const n=D.ours.filter(p=>p.d===r.d&&has(p)).length;return {d:r.d,pop:r.pop,n,v:n?Math.round(r.pop/n):null}}).sort((a,b)=>(b.v??1e9)-(a.v??1e9));
 const maxR=Math.max(...rows.filter(r=>r.v).map(r=>r.v));
 pd.innerHTML=`<p class="note">Сколько жителей приходится на одну точку${PROD?` с продуктом «${PROD}»`:' с Панацеей'}. Чем длиннее полоса, тем хуже покрыт район. Население — перепись 2022.</p>`+
 rows.map(r=>{const w=r.v?Math.round(r.v/maxR*100):100,col=!r.v||r.v>15000?C.gap:r.v>8000?C.pc:C.ours;
  return `<div class="drow"><span class="nm">${r.d}</span><span class="num">${r.n} точ. · ${r.v?('1 на '+(r.v/1000).toFixed(1)+' тыс.'):'нет точек'}</span><div class="bar"><i style="width:${w}%;background:${col}"></i></div></div>`}).join('')+
 (PROD?'':`<h3>Вывод</h3><p class="note">Кентрон и Арабкир держат 59 из 104 точек. В Эребуни, Шенгавите, Аджапняке, Давташене и Нор Норке одна точка приходится на 21–25 тыс. жителей, в Кентроне на 3 тыс. Там живёт больше половины города.</p>`);
}
/* --- Куда идти --- */
const pg=document.getElementById('p-go');let gf='all';
function renderGo(){
 const list=D.tg.filter(t=>t.km>=0.3&&(gf==='all'||(gf==='pc'?t.pc:!t.pc)));
 pg.innerHTML=`<p class="note">Супермаркеты, где Панацеи нет, отсортированы по расстоянию до ближайшей вашей полки. Оранжевые: сеть уже ваш партнёр, нужно только добавить магазин в поставку. Синие: новая сеть.</p>
 <div class="filters"><button class="chip ${gf==='all'?'on':''}" data-f="all">Все</button><button class="chip ${gf==='pc'?'on':''}" data-f="pc">Сеть-партнёр</button><button class="chip ${gf==='nw'?'on':''}" data-f="nw">Новые сети</button></div>`+
 list.map((t,i)=>`<div class="item" data-i="${D.tg.indexOf(t)}"><span class="dot" style="background:${t.pc?C.pc:C.nw}"></span><div><b>${esc(t.n)}</b><small>${esc(t.a)}</small><span class="pill ${t.pc?'pc':'nw'}">${t.pc?'Добавить в поставку':'Новая сеть'}</span></div><span class="km">${t.km} км</span></div>`).join('')+
 `<p class="note" style="margin-top:12px">База супермаркетов неполная: в ней крупные сети и часть районных магазинов. Красные зоны без точек на карте — это районы, где магазины нужно найти на месте.</p>`;
 pg.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{gf=b.dataset.f;renderGo()});
 pg.querySelectorAll('.item').forEach(el=>el.onclick=()=>{const t=D.tg[+el.dataset.i];focus(t)});
}
renderGo();

/* --- Наши точки --- */
const pp=document.getElementById('p-pts');let pf='all';
function renderPts(){
 const list=D.ours.filter(p=>pf==='all'||p.dp===pf);
 pp.innerHTML=`<p class="note">«Узкая полка» значит, что точка берёт только перечисленные продукты. Больше всего таких в Yerevan City: 26 из 42 магазинов. Это рост без новых договоров.</p>
 <div class="filters">${['all','Полная линейка','Почти полная','Узкая полка'].map(f=>`<button class="chip ${pf===f?'on':''}" data-f="${f}">${f==='all'?'Все':f}</button>`).join('')}</div>`+
 list.map(p=>`<div class="item" data-i="${D.ours.indexOf(p)}"><span class="dot" style="background:${C.ours}"></span><div><b>${esc(p.c)}</b><small>${esc(p.a)} · ${esc(p.d)}</small><span class="pill ${depthCls[p.dp]}">${p.dp}</span></div><span></span></div>`).join('');
 pp.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{pf=b.dataset.f;renderPts()});
 pp.querySelectorAll('.item').forEach(el=>el.onclick=()=>focus(D.ours[+el.dataset.i]));
}
renderPts();

refresh();
function focus(o){map.setView([o.lat,o.lng],15);o.m.openPopup();if(innerWidth<820)window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 ['prod','dist','go','pts'].forEach(t=>document.getElementById('p-'+t).hidden=t!==b.dataset.t);
});
</script></body></html>
